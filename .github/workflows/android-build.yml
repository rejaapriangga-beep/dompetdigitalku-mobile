name: Android Build

# Build APK debug otomatis di server GitHub — tidak perlu Flutter/Android SDK
# di laptop. Hasilnya bisa diunduh dari tab "Actions" pada run yang
# bersangkutan, bagian "Artifacts" (kedaluwarsa otomatis setelah 30 hari).
#
# Cara pakai:
# 1. Push kode ke branch main (atau jalankan manual lewat tab Actions ->
#    "Android Build" -> "Run workflow").
# 2. Tunggu run-nya selesai (ikon hijau centang).
# 3. Buka run tersebut -> scroll ke bagian "Artifacts" di bawah -> unduh
#    "dompetdigitalku-debug-apk" (berupa .zip berisi satu file .apk).
# 4. Salin .apk ke HP dan install manual (aktifkan "Izinkan dari sumber ini"
#    kalau diminta).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dompetdigitalku-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
